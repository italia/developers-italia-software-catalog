name: CI

# Spenta: parte solo a mano (Actions → CI → Run workflow).
# Per riattivarla sui push e sulle PR, togliere il commento alle righe qui sotto.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  # pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4


      - run: bun install --frozen-lockfile
      - run: bun run db:validate
      - run: bun run db:generate
      - run: bun run typecheck
      - run: bun run test
      - run: bun run --filter @sw-catalog/catalog-website build
      - run: bun run --filter @sw-catalog/dashboard build
