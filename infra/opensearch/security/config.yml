# Configurazione del security plugin di OpenSearch per il catalogo.
#
# Come in produzione (opensearch.developers.italia.it), le richieste senza credenziali
# passano come utente anonimo: il ruolo catalog_public_read (creato da ../setup.sh) gli
# permette solo di cercare sull'alias del catalogo (D2 di new-plan.md). Tutto il resto
# richiede l'autenticazione Basic (utenti interni: admin, indexer).
#
# Viene letta solo quando l'indice di sicurezza non esiste ancora (primo avvio con un
# volume vuoto). Per applicare modifiche successive serve securityadmin.sh oppure
# ripartire da un volume nuovo.
_meta:
  type: "config"
  config_version: 2

config:
  dynamic:
    http:
      anonymous_auth_enabled: true
      xff:
        enabled: false
    authc:
      basic_internal_auth_domain:
        description: "Autenticazione HTTP Basic con gli utenti interni"
        http_enabled: true
        transport_enabled: true
        order: 0
        http_authenticator:
          type: basic
          # false: senza credenziali niente 401 con richiesta di login, si passa come anonimo.
          challenge: false
        authentication_backend:
          type: intern
    authz: {}
